<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0076CE"/>
      <stop offset="100%" stop-color="#002D62"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Battery Terminal -->
  <rect x="54" y="24" width="20" height="6" rx="3" fill="#B0BEC5"/>

  <!-- Battery Body Outline -->
  <rect x="36" y="28" width="56" height="76" rx="12" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- 50% Green/Cyan Level Fill (Half Full) -->
  <rect x="42" y="66" width="44" height="32" rx="6" fill="url(#shieldGrad)"/>

  <!-- Shield Protector Emblem -->
  <path d="M64 42 L78 48 C78 64 64 74 64 74 C64 74 50 64 50 48 Z" fill="#FFFFFF" opacity="0.95" filter="url(#dropShadow)"/>

  <!-- Lightning Bolt inside Shield -->
  <path d="M65 48 L58 58 L63 58 L62 67 L70 56 L65 56 Z" fill="#0076CE"/>
</svg>
