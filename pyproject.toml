[project]
name = "dell-power-manager"
version = "0.1.0"
description = "Native Linux GUI & CLI to limit battery charging thresholds (50%, 80%), manage SMBIOS power profiles, and protect battery health on Dell laptops."
authors = [
    { name = "moalmatry" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "dell",
    "dell-power-manager",
    "battery",
    "battery-health",
    "charge-threshold",
    "smbios",
    "power-management",
    "longevity",
    "linux",
    "gtk3",
    "dell-g15",
    "xps",
    "alienware",
    "latitude",
]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Hardware",
    "Topic :: System :: Power (UPS)",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/moalmatry/dell-power-manager"
Repository = "https://github.com/moalmatry/dell-power-manager"
Issues = "https://github.com/moalmatry/dell-power-manager/issues"

[project.scripts]
dell-power = "dell_power.cli:main"
dell-power-gui = "dell_power.gui:main"

[tool.poetry]
packages = [{ include = "dell_power", from = "src" }]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
